[package]
name = "deskport"
version = "0.1.0"
description = "Local MCP bridge with OAuth 2.1, workspace allow-listing and tunnels"
authors = ["DeskPort Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "deskport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deskport"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
url = "2"
ureq = "2"
flate2 = "1"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
